x-redis-cred: &redis-cred
  REDIS_HOST: "redis"
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: "qwerty"

x-pg-cred: &pg-cred
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: "db"

x-api-env: &api-env
  <<: [*pg-cred, *redis-cred]


services:
  api:
    image: fastapi_app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-prod}
    container_name: ${COMPOSE_PROJECT_NAME}_api
    ports:
      - 127.0.0.1:${EXTERNAL_APP_PORT:-8005}:8000
    volumes:
      - .:/app
      - ./storage:/app/storage
    environment: *api-env
    depends_on:
      - db
#      - redis

  db:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME}_pg
    environment: *pg-cred
    volumes:
      - ./.postgres:/var/lib/postgresql/data
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    ports:
      - ${EXTERNAL_DB_PORT:-54321}:5432

